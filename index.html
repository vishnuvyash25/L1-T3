<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A premium, interactive, glassmorphic calculator application built with HTML, CSS Grid, and JavaScript.">
    <title>Quantum Calc - Modern Glassmorphic Calculator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-decorations">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <main class="calculator-container">
        <header class="calculator-header">
            <h1 class="logo">QUANTUM<span>CALC</span></h1>
            <div class="status-indicator">
                <span class="pulse-dot"></span>
                <span class="status-text">Online</span>
            </div>
        </header>

        <!-- Display Area -->
        <section class="display" aria-label="Calculator Display">
            <div class="previous-operand" id="previous-operand" aria-live="polite"></div>
            <div class="current-operand" id="current-operand" aria-live="polite">0</div>
        </section>

        <!-- Keypad Area using CSS Grid -->
        <section class="keypad" aria-label="Calculator Keypad">
            <!-- Row 1 -->
            <button class="btn btn-utility" id="clear-all" data-action="all-clear">AC</button>
            <button class="btn btn-utility" id="delete" data-action="delete" aria-label="Delete last character">
                <!-- SVG Backspace Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
            </button>
            <button class="btn btn-utility" id="plus-minus" data-action="toggle-sign">±</button>
            <button class="btn btn-operator" data-operator="/" aria-label="Divide">÷</button>

            <!-- Row 2 -->
            <button class="btn btn-number" data-number="7">7</button>
            <button class="btn btn-number" data-number="8">8</button>
            <button class="btn btn-number" data-number="9">9</button>
            <button class="btn btn-operator" data-operator="*" aria-label="Multiply">×</button>

            <!-- Row 3 -->
            <button class="btn btn-number" data-number="4">4</button>
            <button class="btn btn-number" data-number="5">5</button>
            <button class="btn btn-number" data-number="6">6</button>
            <button class="btn btn-operator" data-operator="-" aria-label="Subtract">−</button>

            <!-- Row 4 -->
            <button class="btn btn-number" data-number="1">1</button>
            <button class="btn btn-number" data-number="2">2</button>
            <button class="btn btn-number" data-number="3">3</button>
            <button class="btn btn-operator" data-operator="+" aria-label="Add">+</button>

            <!-- Row 5 -->
            <button class="btn btn-number span-two" data-number="0">0</button>
            <button class="btn btn-number" data-number=".">.</button>
            <button class="btn btn-equals" id="equals" data-action="calculate" aria-label="Equals">=</button>
        </section>
    </main>

    <footer class="calculator-footer">
        <p>Interactive Premium Calculator &copy; 2026. All rights reserved.</p>
    </footer>

    <!-- Script -->
    <script src="app.js"></script>
</body>
</html>
